<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#e9e9e3">
<title>Phase 4 / Training Console</title>
<style>
:root{--paper:#e9e9e3;--card:#f8f8f4;--ink:#111310;--muted:#666b65;--line:#c8cbc3;--signal:#ff4f24;--blue:#2455ff;--inv:#101210;--invink:#f3f4ed;--mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
@media(prefers-color-scheme:dark){:root{--paper:#0e100f;--card:#181b19;--ink:#eef0ea;--muted:#929890;--line:#303530;--signal:#ff6843;--blue:#7696ff;--inv:#eef0ea;--invink:#111310}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{background:var(--paper)}body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:120px}.shell{width:min(100%,720px);margin:auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(18px);padding-top:max(8px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.mast{display:grid;grid-template-columns:1fr auto;align-items:end;padding:9px 0 11px}.brand{font:700 10px/1 var(--mono);letter-spacing:.16em}.clock{font:650 32px/.9 var(--mono);letter-spacing:-.07em}.status{text-align:right;font:650 9px/1.4 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}.status b{color:var(--signal)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding-bottom:9px}.day{border:0;border-top:1px solid var(--line);background:none;padding:7px 2px 4px;text-align:left;color:var(--ink)}.day .d{display:block;font:750 11px/1 var(--mono)}.day .n{display:block;margin-top:5px;font:650 7px/1 var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden}.day.today{border-top-color:var(--signal)}.day[aria-selected=true]{border-top:3px solid var(--ink);padding-top:5px}.day[aria-selected=true] .n{color:var(--ink)}
.hero{padding:29px 0 18px;border-bottom:1px solid var(--ink)}.eyebrow{font:750 9px/1 var(--mono);letter-spacing:.15em;color:var(--signal)}h1{font-size:clamp(38px,10vw,68px);line-height:.88;letter-spacing:-.065em;margin:8px 0 15px;text-transform:uppercase}.meta{display:flex;justify-content:space-between;gap:12px;font:650 9px/1.45 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.progress{height:3px;background:var(--line);margin-top:15px}.progress i{display:block;height:100%;background:var(--signal);transition:width .2s}
.section{padding-top:21px}.label{font:750 9px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}.warm{font-size:14px;line-height:1.55;border-bottom:1px solid var(--line);padding-bottom:17px}.warm b{font:700 10px/1 var(--mono);margin-right:8px}
.ex{border-top:1px solid var(--line);padding:16px 0 15px;cursor:pointer}.exrow{display:grid;grid-template-columns:1fr auto;gap:14px}.exname{font-size:20px;line-height:1.05;font-weight:680;letter-spacing:-.025em}.exrx{font:750 17px/1 var(--mono);letter-spacing:-.05em}.excue{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.45}.exfoot{display:flex;align-items:center;gap:10px;margin-top:13px}.dots{display:flex;gap:5px;flex:1}.dot{width:25px;height:5px;background:var(--line)}.dot.on{background:var(--ink)}.rest{border:1px solid var(--line);background:none;padding:7px 9px;font:650 9px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase}.ex.done{opacity:.32}.ex.done .exname{text-decoration:line-through;text-decoration-thickness:1px}
.grp{margin:9px 0 2px;padding:8px 12px 1px;border-left:2px solid var(--blue);background:color-mix(in srgb,var(--blue) 4%,transparent)}.grpl{font:750 8px/1 var(--mono);letter-spacing:.15em;color:var(--blue);text-transform:uppercase;padding:4px 0 5px}.grp .ex:first-of-type{border-top:0}
.run{margin-top:27px;background:var(--inv);color:var(--invink);padding:18px}.runhead{display:flex;justify-content:space-between;font:650 9px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;opacity:.58}.rmain{font-size:clamp(34px,10vw,58px);line-height:.86;letter-spacing:-.06em;font-weight:800;text-transform:uppercase;margin-top:24px}.rnote{font-size:13px;line-height:1.5;opacity:.68;margin-top:16px}
.fuel{margin-top:12px;border:1px solid var(--line);background:var(--card);padding:15px}.fuelh{font:750 9px/1 var(--mono);letter-spacing:.15em;color:var(--muted);text-transform:uppercase}.macros{font:750 16px/1.5 var(--mono);margin-top:9px}.fueln{border-top:1px solid var(--line);margin-top:11px;padding-top:11px;color:var(--muted);font-size:13px;line-height:1.45}
.zones{margin:25px 0 8px;border-top:1px solid var(--ink);padding-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px 16px;font:600 9px/1.5 var(--mono);color:var(--muted)}.zones b{color:var(--ink)}.reset{width:100%;border:0;border-top:1px solid var(--line);background:none;padding:18px 0;text-align:left;font:650 9px/1 var(--mono);letter-spacing:.13em;color:var(--muted);text-transform:uppercase}
.timer{position:fixed;z-index:50;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:none;background:var(--signal);color:#111;padding:13px 14px;box-shadow:0 8px 40px #0004}.timer.on{display:flex;align-items:center}.tlab{font:750 9px/1 var(--mono);letter-spacing:.14em}.tnum{font:800 30px/1 var(--mono);letter-spacing:-.07em;margin-top:4px}.timer button{margin-left:auto;border:1px solid #111;background:none;padding:9px 12px;font:700 9px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
@media(min-width:600px){.shell{padding:0 22px}.days{gap:10px}.day .n{font-size:8px}}
</style>
</head>
<body>
<div class="top"><div class="shell"><div class="mast"><div><div class="brand">PHASE 4 / BUILD + SHARPEN</div><div class="clock" id="now">--:--</div></div><div class="status" id="status"></div></div><div class="days" id="days"></div></div></div>
<main class="shell" id="view"></main>
<div class="timer" id="timer"><div><div class="tlab">REST / RECOVER</div><div class="tnum" id="tnum">0:00</div></div><button id="tstop">STOP</button></div>
<script>
const PLAN=[
{key:"mon",d:"M",n:"Lower A",title:"Lower A · Quads",focus:"Quad focus + 2 mi easy",window:"6:15 – 7:20",
 warm:{t:"6:15",title:"Warm-up",n:"3 min bike or row easy · 10 leg swings per side · 15 bodyweight squats · 10 walking lunges"},
 ex:[
  {n:"DB front squat",rx:"4 × 8",sets:4,rest:90,cue:"Two DBs racked at shoulders. RPE 8 — two reps in reserve on set one."},
  {n:"DB Bulgarian split squat",rx:"3 × 10",sets:3,cue:"Per leg. Rear foot on bench, torso slightly forward.",g:"B"},
  {n:"Standing calf raise",rx:"3 × 15",sets:3,rest:60,cue:"Two-second pause at the top.",g:"B"},
  {n:"DB step-up",rx:"3 × 10",sets:3,cue:"Per leg, 18–20 inch box. Drive through the heel, no push off the trail leg.",g:"C"},
  {n:"Hanging knee raise",rx:"3 × 12",sets:3,rest:60,cue:"Slow lower, no swing.",g:"C"},
  {n:"Wall sit",rx:"2 × 45s",sets:2,rest:30,cue:"Finisher."}],
 run:{t:"~6:55",title:"Run — easy",main:"2 mi @ 9:45–10:15",n:"A flush, not a workout. If it's dipping under 9:30 you're running it too hard."},
 fuel:{m:"2,650–2,750 kcal<br>190P · 300C · 75F",n:"Pre-lift: 150–250 kcal of fast carbs only — chocolate milk or half a banana. Fasted is fine today. Full breakfast after."}},

{key:"tue",d:"T",n:"Push",title:"Upper Push",focus:"Push + intervals",window:"6:15 – 7:25",
 warm:{t:"6:15",title:"Warm-up",n:"Arm circles · 15 band pull-aparts · one light set of incline press"},
 ex:[
  {n:"Incline DB press",rx:"4 × 8",sets:4,rest:90,cue:"Primary progression lift. Start 45 lb — drop to 40 if the last set gets ugly."},
  {n:"Seated DB shoulder press",rx:"3 × 10",sets:3,cue:"Start 25 lb.",g:"B"},
  {n:"DB lateral raise",rx:"3 × 15",sets:3,rest:60,cue:"Light, 12–15 lb. Elbows lead.",g:"B"},
  {n:"DB floor press",rx:"3 × 12",sets:3,cue:"Flat press works too.",g:"C"},
  {n:"Overhead DB triceps ext.",rx:"3 × 12",sets:3,rest:45,cue:"Cable pushdown is a fine swap.",g:"C"}],
 run:{t:"~6:50",title:"Run — intervals",main:"5 × 800m @ 7:50–8:10",n:"1 mi easy warm-up · 2 min slow jog between reps · 0.5 mi cooldown. Go to 6 reps from week 3."},
 fuel:{m:"2,650–2,750 kcal<br>190P · 300C · 75F",n:"Eat before this one — 150–250 kcal of carbs. Intervals on empty is how the session falls apart at rep four."}},

{key:"wed",d:"W",n:"Lower B",title:"Lower B · Hinge",focus:"Posterior chain + 3 mi easy",window:"6:15 – 7:30",
 warm:{t:"6:15",title:"Warm-up",n:"3 min row · 10 cat-cows · 15 glute bridges · 10 unloaded good mornings"},
 ex:[
  {n:"DB Romanian deadlift",rx:"4 × 10",sets:4,rest:90,cue:"Hinge, don't squat. Soft knees, shins vertical, load the hamstrings."},
  {n:"Cable pull-through",rx:"3 × 15",sets:3,cue:"Rope between the legs, hinge back, snap the hips forward. Squeeze at the top — this is a hinge, not a squat. No cable: DB frog pump, 3 × 20.",g:"B"},
  {n:"Single-leg DB deadlift",rx:"3 × 8",sets:3,rest:75,cue:"Per leg. Doubles as ankle and hip stability for running.",g:"B"},
  {n:"DB sumo squat",rx:"3 × 12",sets:3,cue:"Wide stance, one DB between the legs.",g:"C"},
  {n:"Standing side crunch",rx:"3 × 15",sets:3,rest:60,cue:"Per side, 45 lb.",g:"C"},
  {n:"Side plank",rx:"2 × 40s",sets:2,rest:30,cue:"Per side."}],
 run:{t:"~6:58",title:"Run — easy",main:"3 mi @ 9:45–10:15",n:"Conversational. Heart rate under 135."},
 fuel:{m:"2,650–2,750 kcal<br>190P · 300C · 75F",n:"Biggest session of the week for the flanks and for running economy. Don't short the carbs today."}},

{key:"thu",d:"T",n:"Pull",title:"Upper Pull",focus:"Pull + tempo",window:"6:15 – 7:25",
 warm:{t:"6:15",title:"Warm-up",n:"Band pull-aparts · two 20-second dead hangs · one light row set"},
 ex:[
  {n:"Single-arm DB row",rx:"4 × 10",sets:4,rest:75,cue:"Per arm, bench-supported. Primary progression lift. Pull to the hip, not the armpit."},
  {n:"Pull-up",rx:"3 × max",sets:3,cue:"Lat pulldown, assisted, or negatives if you can't clear six.",g:"B"},
  {n:"DB rear delt fly",rx:"3 × 15",sets:3,rest:60,cue:"Light. Chest on an incline bench.",g:"B"},
  {n:"Incline DB curl",rx:"3 × 10",sets:3,cue:"Full stretch at the bottom.",g:"C"},
  {n:"Face pull",rx:"3 × 20",sets:3,rest:45,cue:"Cable or band. Postural insurance for four days at a desk.",g:"C"}],
 run:{t:"~6:50",title:"Run — tempo",main:"22 min @ 8:20–8:40",n:"1 mi easy in · continuous tempo · 0.5 mi cooldown. Comfortably hard, three-word answers. Add 2 min every second week."},
 fuel:{m:"2,650–2,750 kcal<br>190P · 300C · 75F",n:"Carbs before this one too. Tempo is the other session that needs fuel in the tank."}},

{key:"fri",d:"F",n:"Arms",title:"Shoulders · Arms · Core",focus:"Lightest lift of the week",window:"6:20 – 7:25",
 warm:{t:"6:20",title:"HIIT row opener",n:"30 seconds on, 15 seconds off, 12 rounds. Your usual."},
 ex:[
  {n:"DB lateral raise",rx:"4 × 15",sets:4,cue:"Light. Elbows lead, no swing.",g:"A"},
  {n:"DB hammer curl",rx:"4 × 10",sets:4,rest:60,cue:"Neutral grip throughout.",g:"A"},
  {n:"DB Arnold press",rx:"3 × 10",sets:3,cue:"Rotate from palms-in to palms-out.",g:"B"},
  {n:"Overhead DB triceps ext.",rx:"3 × 12",sets:3,rest:60,cue:"One DB, both hands.",g:"B"},
  {n:"Medicine ball slam",rx:"3 × 15",sets:3,rest:45,cue:"15 lb. Full overhead reach."},
  {n:"Plank",rx:"3 × 45s",sets:3,rest:30,cue:"Ribs down, glutes on."}],
 run:{t:"~7:10",title:"Run — optional",main:"2 mi very easy, or 15 min spin",n:"Genuinely optional. Skip it if your legs feel heavy — tomorrow matters more."},
 fuel:{m:"2,650–2,750 kcal<br>190P · 300C · 75F",n:"Front-load carbs through the afternoon so you start tomorrow's long run topped off."}},

{key:"sat",d:"S",n:"Long",title:"Long Run",focus:"No clock. Fuel first.",window:"Open",warm:null,ex:[],
 run:{t:"",title:"Run — long",main:"Week 1 · 8 mi @ 9:30–10:00",n:"Ladder: 8 → 10 → 12 → 8 (cutback) → 12 → 13 → 14 → 10. Over 10 mi: one gel at mile 7, another at 11. Take 40–60g carbs beforehand."},
 fuel:{m:"2,800–2,900 kcal<br>180P · 350C · 75F",n:"Weigh in and take waist and hip measurements before eating, every second Saturday. Same spot each time."}},

{key:"sun",d:"S",n:"Rest",title:"Rest",focus:"Walking only",window:"—",warm:null,ex:[],
 run:{t:"",title:"Rest day",main:"Walking only",n:"A real rest day, not an easy-run day. This is where the adaptation actually happens."},
 fuel:{m:"2,200–2,300 kcal<br>190P · 180C · 70F",n:"Carbs pull back to about 180g. Protein stays high."}}];
const START=new Date(2026,7,31), LADDER=[8,10,12,8,12,13,14,10];
const todayIdx=()=>(new Date().getDay()+6)%7;
const dateKey=()=>new Date().toISOString().slice(0,10);
let sel=todayIdx(), prog={};
const $=x=>document.getElementById(x);
function storageGet(){try{return localStorage.getItem("p4:"+dateKey())}catch(e){return null}}
function save(){try{localStorage.setItem("p4:"+dateKey(),JSON.stringify(prog))}catch(e){}}
try{prog=JSON.parse(storageGet()||"{}")||{}}catch(e){prog={}}
function weekNo(){return Math.max(1,Math.floor((new Date()-START)/604800000)+1)}
function renderDays(){$("days").innerHTML=PLAN.map((p,i)=>`<button class="day ${i===todayIdx()?"today":""}" aria-selected="${i===sel}" data-i="${i}"><span class="d">${p.d}</span><span class="n">${p.n}</span></button>`).join("")}
function exHTML(e,i,key){const c=prog[key+i]||0,full=c>=e.sets;return `<div class="ex ${full?"done":""}" data-ex="${i}"><div class="exrow"><div class="exname">${e.n}</div><div class="exrx">${e.rx}</div></div><div class="excue">${e.cue||""}</div><div class="exfoot"><div class="dots">${Array.from({length:e.sets},(_,k)=>`<i class="dot ${k<c?"on":""}"></i>`).join("")}</div>${e.rest?`<button class="rest" data-rest="${e.rest}">${e.rest} SEC</button>`:""}</div></div>`}
function renderView(){const p=PLAN[sel];let total=p.ex.reduce((a,e)=>a+e.sets,0),done=p.ex.reduce((a,e,i)=>a+Math.min(prog[p.key+i]||0,e.sets),0);let runMain=p.run.main,runNote=p.run.n;if(p.key==="sat"){let w=weekNo(),mi=LADDER[(w-1)%LADDER.length];runMain=`W${w} / ${mi} MI`;runNote=`${mi} miles @ 9:30–10:00. `+p.run.n.replace(/^Week 1 · 8 mi @ 9:30–10:00\.?\s*/,"")}
let h=`<section class="hero"><div class="eyebrow">${sel===todayIdx()?"TODAY":"WEEK VIEW"}</div><h1>${p.title}</h1><div class="meta"><span>${p.focus}</span><span>${p.window}</span></div>${total?`<div class="progress"><i style="width:${done/total*100}%"></i></div>`:""}</section>`;
if(p.warm)h+=`<section class="section"><div class="label">01 / PREP</div><div class="warm"><b>${p.warm.t}</b>${p.warm.n}</div></section>`;
if(p.ex.length){h+=`<section class="section"><div class="label">02 / STRENGTH · ${done}/${total} SETS</div>`;let i=0;while(i<p.ex.length){let g=p.ex[i].g;if(g){let j=i,s="";while(j<p.ex.length&&p.ex[j].g===g){s+=exHTML(p.ex[j],j,p.key);j++}h+=`<div class="grp"><div class="grpl">SUPERSET / ALTERNATE</div>${s}</div>`;i=j}else{h+=exHTML(p.ex[i],i,p.key);i++}}h+=`</section>`}
h+=`<section class="run"><div class="runhead"><span>${p.run.title}</span><span>${p.run.t||"—"}</span></div><div class="rmain">${runMain}</div><div class="rnote">${runNote}</div></section>`;
h+=`<section class="fuel"><div class="fuelh">FUEL / DAILY TARGET</div><div class="macros">${p.fuel.m}</div><div class="fueln">${p.fuel.n}</div></section>`;
h+=`<div class="zones"><span><b>EASY</b> 9:45–10:15 · HR &lt;135</span><span><b>LONG</b> 9:30–10:00</span><span><b>TEMPO</b> 8:20–8:40 · HR 155–165</span><span><b>INTERVAL</b> 7:50–8:10</span><span><b>LOAD</b> + when top set has 2 RIR</span></div>`;
if(p.ex.length)h+=`<button class="reset" id="reset">RESET TODAY’S SETS</button>`;$("view").innerHTML=h}
document.addEventListener("click",e=>{let day=e.target.closest(".day");if(day){sel=+day.dataset.i;renderDays();renderView();scrollTo(0,0);return}let rest=e.target.closest(".rest");if(rest){e.stopPropagation();startTimer(+rest.dataset.rest);return}let ex=e.target.closest(".ex");if(ex){let p=PLAN[sel],i=+ex.dataset.ex,k=p.key+i,max=p.ex[i].sets;prog[k]=((prog[k]||0)>=max)?0:(prog[k]||0)+1;save();renderView();if(navigator.vibrate)navigator.vibrate(15);return}if(e.target.id==="reset"){PLAN[sel].ex.forEach((_,i)=>delete prog[PLAN[sel].key+i]);save();renderView()}});
let tid,left=0;const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function beep(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(a.currentTime+.14)}catch(e){}}
function startTimer(s){clearInterval(tid);left=s;$("timer").classList.add("on");$("tnum").textContent=fmt(left);tid=setInterval(()=>{left--;$("tnum").textContent=fmt(Math.max(0,left));if(left<=0){clearInterval(tid);$("tnum").textContent="GO";beep();if(navigator.vibrate)navigator.vibrate([100,70,100]);setTimeout(stopTimer,2600)}},1000)}
function stopTimer(){clearInterval(tid);$("timer").classList.remove("on")} $("tstop").onclick=stopTimer;
function tick(){let d=new Date(),m=d.getHours()*60+d.getMinutes(),wd=d.getDay()>=1&&d.getDay()<=4;$("now").textContent=d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",hour12:false});$("status").innerHTML=wd&&m>240&&m<480?`<b>${Math.floor((480-m)/60)}H ${(480-m)%60}M</b><br>UNTIL OUT THE DOOR`:wd&&m>=480&&m<540?`<b>GO</b><br>YOU’RE LATE`:`WEEK ${weekNo()}<br>BUILD + SHARPEN`}
tick();setInterval(tick,10000);renderDays();renderView();
</script></body></html>
